apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "elastic-agent.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: elastic-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: elastic-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elastic-agent
    spec:
      serviceAccountName: {{ include "elastic-agent.serviceAccountName" . }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: rotated-backuper
          image: bash:5.2
          command:
            - "bash"
            - "-c"
            - |
              apk -U add findutils
              bash /usr/local/bin/backup-rotated.sh -s 1 -r 600
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: configmap-scripts
              mountPath: /usr/local/bin/backup-rotated.sh
              subPath: backup-rotated.sh
        - name: agent
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - name: fleet-log-udp
              hostPort: 8080
              containerPort: 8080
              protocol: UDP
          env:
          {{- if .Values.env }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
            - name: FLEET_ENROLLMENT_TOKEN
              value: "${FLEET_ENROLLMENT_TOKEN}"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - name: configmap-config
              mountPath: /usr/share/elastic-agent/elastic-agent.yml
              subPath: elastic-agent.yml
            - name: proc
              mountPath: /hostfs/proc
              readOnly: true
            - name: cgroup
              mountPath: /hostfs/sys/fs/cgroup
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: etc-full
              mountPath: /hostfs/etc
              readOnly: true
            - name: var-lib
              mountPath: /hostfs/var/lib
              readOnly: true
            - name: etc-mid
              mountPath: /etc/machine-id
              readOnly: true
            #- name: sys-kernel-debug
            #  mountPath: /sys/kernel/debug
            - name: elastic-agent-state
              mountPath: /usr/share/elastic-agent/state
      volumes:
        - name: configmap-scripts
          configMap:
            name: {{ include "elastic-agent.name" . }}-configmap-scripts
        - name: configmap-config
          configMap:
            name: {{ include "elastic-agent.name" . }}-configmap-config
        - name: proc
          hostPath:
            path: /proc
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: varlog
          hostPath:
            path: /var/log
        # The following volumes are needed for Cloud Security Posture integration (cloudbeat)
        # If you are not using this integration, then these volumes and the corresponding
        # mounts can be removed.
        - name: etc-full
          hostPath:
            path: /etc
        - name: var-lib
          hostPath:
            path: /var/lib
        # Mount /etc/machine-id from the host to determine host ID
        # Needed for Elastic Security integration
        - name: etc-mid
          hostPath:
            path: /etc/machine-id
            type: File
        # Needed for Universal Profiling
        # If you are not using this integration, then these volumes and the corresponding
        # mounts can be removed.
        #- name: sys-kernel-debug
        #  hostPath:
        #    path: /sys/kernel/debug
        # Mount /var/lib/elastic-agent-managed/kube-system/state to store elastic-agent state
        # Update 'kube-system' with the namespace of your agent installation
        - name: elastic-agent-state
          hostPath:
            path: /var/lib/elastic-agent-managed/{{ .Values.namespace }}/state
            type: DirectoryOrCreate
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}