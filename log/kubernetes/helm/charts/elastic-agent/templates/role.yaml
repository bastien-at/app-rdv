apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "elastic-agent.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: elastic-agent
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs: ["get", "create", "update"]