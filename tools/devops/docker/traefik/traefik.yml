providers:
  # Docker configuration backend
  docker:
    # Need to use traefik.enable=true label to expose a container to traefik
    exposedByDefault: false
    constraints: "Label(`avanis_app`,`__avanis_app__`) || Label(`alltricks_app`,`__avanis_app__`)"
  file:
    directory: /etc/traefik/dynamic

api:
  insecure: true

entryPoints:
  # Httpd - Nginx
  "80":
    address: ":80"
    transport:
      respondingTimeouts:
        readTimeout: "0"
        idleTimeout: "0"
  "443":
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: "0"
        idleTimeout: "0"
  "8080":
    address: ":8080"
    transport:
      respondingTimeouts:
        readTimeout: "0"
        idleTimeout: "0"

