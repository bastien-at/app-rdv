        idleTimeout: "0"

  # Traefik
  traefik:
    address: ":9000"

http:
  routers:
    api:
      rule: PathPrefix(`/api`) || PathPrefix(`/dashboard`)
      entrypoints:
        - traefik
      service: api@internal

tls:
  stores:
    default:
      defaultCertificate: ~
