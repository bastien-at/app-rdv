apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "elastic-agent.name" . }}
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "elastic-agent.name" . }}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: {{ include "elastic-agent.name" . }}
  apiGroup: rbac.authorization.k8s.io
