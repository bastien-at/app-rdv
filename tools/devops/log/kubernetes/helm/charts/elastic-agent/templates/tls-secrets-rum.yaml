{{- if .Values.rum.enabled }}
{{- $root := . -}}
{{- range .Values.rum.ingress.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  labels:
    app: {{ template "elastic-agent.name" $root }}
    {{- include "elastic-agent.labels" $root | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .certificate | b64enc }}
  tls.key: {{ .key | b64enc }}
{{- end }}
{{- end }}
