apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "elastic-agent.name" . }}-kubeadm-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: elastic-agent
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames:
      - kubeadm-config
    verbs: ["get"]