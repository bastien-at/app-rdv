services:
  fleet-server:
    build:
      context: extensions/fleet/
      args:
        ELASTIC_VERSION: ${ELASTIC_VERSION}
    volumes:
      - fleet-server:/usr/share/elastic-agent/state:Z
      - ./certs:/usr/share/elastic-agent/config/certs/ca/:ro,Z
      - /data:/data:ro
    environment:
      FLEET_SERVER_ENABLE: '1'
      FLEET_SERVER_INSECURE_HTTP: '0'
      FLEET_SERVER_POLICY_NAME: fleet-server-policy
      FLEET_SERVER_POLICY: fleet-server-policy
      FLEET_SERVER_ELASTICSEARCH_HOST: https://logs.alltricks.sexy:9200
      FLEET_SERVER_CERT: /usr/share/elastic-agent/config/certs/ca/live/logs.alltricks.sexy/fullchain.pem
      FLEET_SERVER_CERT_KEY: /usr/share/elastic-agent/config/certs/ca/live/logs.alltricks.sexy/privkey.pem
      #FLEET_SERVER_HOST: https://logs.alltricks.sexy:8220
      FLEET_ENROLL: '0'
      FLEET_URL: https://logs.alltricks.sexy:8220
      # Fleet plugin in Kibana
      #KIBANA_FLEET_SETUP: '1'
      # Enrollment.
      # (a) Auto-enroll using basic authentication
      #ELASTICSEARCH_USERNAME: elastic
      #ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-}
      # (b) Enroll using a pre-generated service token. Even a false value is required to start the server !
      FLEET_SERVER_SERVICE_TOKEN: ${FLEET_SERVER_SERVICE_TOKEN:-}
    ports:
      - 8220:8220
    hostname: fleet-server
    # Elastic Agent does not retry failed connections to Kibana upon the initial enrollment phase.
    restart: on-failure
    networks:
      - elk

volumes:
  fleet-server:
