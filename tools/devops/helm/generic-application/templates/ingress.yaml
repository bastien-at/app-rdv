{{- if .Values.ingress.enabled -}}

{{- if and .Values.ingress.className (not (hasKey .Values.ingress.annotations "kubernetes.io/ingress.class")) }}
  {{- $_ := set .Values.ingress.annotations "kubernetes.io/ingress.class" .Values.ingress.className }}
{{- end }}

{{- if .Values.ingress.certManager }}
  {{- $_ := set .Values.ingress.annotations "kubernetes.io/tls-acme" "true" }}
{{- end }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "fullname" . }}
  labels:
    app: {{ template "name" . }}
    {{- include "labels" . | nindent 4 }}
  {{- if or (.Values.ingress.annotations) (.Values.global.ingress.basicAuth.enabled) (.Values.ingress.basicAuth.enabled) (.Values.global.ingress.whitelistSourceRanges) (.Values.ingress.whitelistSourceRanges) (.Values.ingress.denylistSourceRanges) (.Values.global.ingress.denylistSourceRanges) }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if or (.Values.global.ingress.basicAuth.enabled) (.Values.ingress.basicAuth.enabled) }}
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
    nginx.ingress.kubernetes.io/configuration-snippet: |-
      proxy_set_header Authorization $http_authorization;
      {{- if .Values.ingress.basicAuth.whitelist }}
      {{- range $whitelist := .Values.ingress.basicAuth.whitelist }}
      allow {{ $whitelist.ip }};
      {{- end }}
      {{- else if .Values.global.ingress.basicAuth.whitelist }}
      {{- range $whitelist := .Values.global.ingress.basicAuth.whitelist }}
      allow {{ $whitelist.ip }};
      {{- end }}
      {{- else if .Values.global.ingress.whitelistSourceRanges }}
      {{- range .Values.global.ingress.whitelistSourceRanges }}
      allow {{ . }};
      {{- end }}
      {{- end }}
      deny all;
      satisfy any;
    {{- else if or ( .Values.ingress.whitelistSourceRanges ) ( .Values.global.ingress.whitelistSourceRanges ) }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ join "," ( or .Values.ingress.whitelistSourceRanges .Values.global.ingress.whitelistSourceRanges ) }}
    {{- end }}
    {{- if or ( .Values.ingress.denylistSourceRanges ) ( .Values.global.ingress.denylistSourceRanges ) }}
    nginx.ingress.kubernetes.io/denylist-source-range: {{ join "," ( or .Values.ingress.denylistSourceRanges .Values.global.ingress.denylistSourceRanges ) }}
    {{- end }}
  {{- end }}
spec:
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ template "fullname" $ }}
                port:
                  number: {{ $.Values.service.ports.http }}
          {{- end }}
    {{- end }}
  {{- end }}
