{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{- if .Values.serviceAccount.name }}{{ .Values.serviceAccount.name }}{{- else if $.Values.serviceAccount.create }}{{ template "fullname" . }}{{- end }}"
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
