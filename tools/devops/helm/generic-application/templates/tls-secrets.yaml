{{- if .Values.ingress.enabled }}
{{- $root := . -}}
{{- range .Values.ingress.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  annotations:
    strategy.spinnaker.io/versioned: 'false'
  labels:
    app: {{ template "name" $root }}
    {{- include "labels" $root | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .certificate | b64enc }}
  tls.key: {{ .key | b64enc }}
---
{{- end }}
{{- end }}
