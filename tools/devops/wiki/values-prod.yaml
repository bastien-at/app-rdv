requarks:
  ingress:
    hosts:
      - host: documentation.alltricks.buzz
        paths:
          - path: "/"
            pathType: Prefix
    tls:
      - secretName: tls-documentation-k8s
        hosts:
        - documentation.alltricks.buzz
  postgresql:
    persistence:
      size: 50Gi
kroki:
  ingress:
    hosts:
      - host: documentation-kroki.alltricks.buzz
        paths: ["/"]
    tls:
      - secretName: tls-kroki-k8s
        hosts:
          - documentation-kroki.alltricks.buzz
